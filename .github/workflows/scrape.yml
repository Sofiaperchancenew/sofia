name: donnees-du-soir
on:
  schedule: [{cron: "0 20 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  soir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/scrape.mjs
      - run: node scripts/mirror-corpus.mjs
      - run: node scripts/merge-contributions.mjs
      - run: git config user.name bot && git config user.email bot@bot && git add data/ src/ satellite/ && git commit -m "donnees du soir" || true && git push
